function stripMacrons(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function normLatin(s){return stripMacrons((s||"").trim().toLowerCase()).replace(/[^a-z]/g,"");}
function choice(a){return a[Math.floor(Math.random()*a.length)];}
function nounForms(e){const forms=[];if(e.decl===1){const stem=e.genitive.slice(0,-2);["a","ae","ae","am","ā","ae","ārum","īs","ās","īs"].forEach(x=>forms.push(stem+x));}else if(e.decl===2){const stem=e.genitive.slice(0,-1);if(e.gender==="n"){["um","ī","ō","um","ō","a","ōrum","īs","a","īs"].forEach(x=>forms.push(stem+x));}else{forms.push(e.lemma);["ī","ō","um","ō","ī","ōrum","īs","ōs","īs"].forEach(x=>forms.push(stem+x));}}else if(e.decl===3){const stem=e.genitive.slice(0,-2);forms.push(e.lemma);if(e.gender==="n"){[e.genitive,stem+"ī",e.lemma,stem+"e",stem+"a",stem+"um",stem+"ibus",stem+"a",stem+"ibus"].forEach(x=>forms.push(x));}else{[e.genitive,stem+"ī",stem+"em",stem+"e",stem+"ēs",stem+"um",stem+"ibus",stem+"ēs",stem+"ibus"].forEach(x=>forms.push(x));}}else if(e.decl===4){const stem=e.genitive.slice(0,-2);if(e.gender==="n"){[e.lemma,e.genitive,stem+"uī",e.lemma,stem+"ū",stem+"ua",stem+"uum",stem+"ibus",stem+"ua",stem+"ibus"].forEach(x=>forms.push(x));}else{[e.lemma,e.genitive,stem+"uī",stem+"um",stem+"ū",stem+"ūs",stem+"uum",stem+"ibus",stem+"ūs",stem+"ibus"].forEach(x=>forms.push(x));}}else if(e.decl===5){const stem=e.genitive.slice(0,-2);[e.lemma,e.genitive,stem+"ēī",stem+"em",stem+"ē",stem+"ēs",stem+"ērum",stem+"ēbus",stem+"ēs",stem+"ēbus"].forEach(x=>forms.push(x));}return [...new Set(forms)].filter(Boolean);}
function adjectiveForms(e){const forms=[];if(e.adjtype==="12"||e.adjtype==="12er"){const m=e.forms[0],f=e.forms[1],n=e.forms[2];const stem=(e.adjtype==="12er"?f.replace(/a$/,''):m.replace(/us$/,''));const fstem=f.replace(/a$/,'');const nstem=n.replace(/um$/,'');forms.push(m,f,n);["ī","ō","um","ō","ī","ōrum","īs","ōs","īs"].forEach(x=>forms.push(stem+x));["ae","ae","am","ā","ae","ārum","īs","ās","īs"].forEach(x=>forms.push(fstem+x));["ī","ō","um","ō","a","ōrum","īs","a","īs"].forEach(x=>forms.push(nstem+x));}else{const stem=e.forms[0].replace(/is$/,'');forms.push(e.forms[0],e.forms[1]);["is","ī","em","ī","ēs","ium","ibus","ēs","ibus","ia"].forEach(x=>forms.push(stem+x));}return [...new Set(forms)].filter(Boolean);}
function presentStem(e){const inf=e.pp[1];if(e.conj===1)return inf.slice(0,-2);if(e.conj===2)return inf.slice(0,-2);if(e.conj===3||e.conj==="3io")return inf.slice(0,-3);if(e.conj===4)return inf.slice(0,-2);}
function perfectStem(e){const p=e.pp[2];if(!p)return null;return p.endsWith("ī")?p.slice(0,-1):p;}
function verbForms(e){const out=new Set([e.lemma]);const s=presentStem(e);const add=a=>a.forEach(x=>out.add(x));if(!s)return [...out];if(e.conj===1){add([s.slice(0,-1)+"ō",s+"s",s+"t",s+"mus",s+"tis",s+"nt"]);add([s.slice(0,-1)+"or",s+"ris",s+"tur",s+"mur",s+"minī",s+"ntur"]);}else if(e.conj===2){add([s+"ō",s+"s",s+"t",s+"mus",s+"tis",s+"nt"]);add([s+"or",s+"ris",s+"tur",s+"mur",s+"minī",s+"ntur"]);}else if(e.conj===3){add([s+"ō",s+"is",s+"it",s+"imus",s+"itis",s+"unt"]);add([s+"or",s+"eris",s+"itur",s+"imur",s+"iminī",s+"untur"]);}else if(e.conj==="3io"){add([s+"iō",s+"is",s+"it",s+"imus",s+"itis",s+"iunt"]);add([s+"ior",s+"eris",s+"itur",s+"imur",s+"iminī",s+"iuntur"]);}else if(e.conj===4){add([s.slice(0,-1)+"iō",s+"s",s+"t",s+"mus",s+"tis",s+"unt"]);add([s.slice(0,-1)+"ior",s+"ris",s+"tur",s+"mur",s+"minī",s+"untur"]);}let imp;if(e.conj===1||e.conj===2)imp=s+"bā";else if(e.conj===3)imp=s+"ēbā";else if(e.conj==="3io")imp=s+"iēbā";else if(e.conj===4)imp=s.slice(0,-1)+"iēbā";if(imp){add([imp+"m",imp+"s",imp+"t",imp+"mus",imp+"tis",imp+"nt"]);add([imp+"r",imp+"ris",imp+"tur",imp+"mur",imp+"minī",imp+"ntur"]);}if(e.conj===1||e.conj===2){const f=s+"b";add([f+"ō",f+"is",f+"it",f+"imus",f+"itis",s+"bunt"]);add([f+"or",f+"eris",f+"itur",f+"imur",f+"iminī",s+"buntur"]);}else{const base=e.conj==="3io"?s+"i":s;add([base+"am",base+"ēs",base+"et",base+"ēmus",base+"ētis",base+"ent"]);add([base+"ar",base+"ēris",base+"ētur",base+"ēmur",base+"ēminī",base+"entur"]);}const ps=perfectStem(e);if(ps){add([ps+"ī",ps+"istī",ps+"it",ps+"imus",ps+"istis",ps+"ērunt"]);add([ps+"eram",ps+"erās",ps+"erat",ps+"erāmus",ps+"erātis",ps+"erant"]);add([ps+"erō",ps+"eris",ps+"erit",ps+"erimus",ps+"eritis",ps+"erint"]);}return [...out].filter(Boolean);}
function formsFor(e){if(e.pos==="noun")return nounForms(e);if(e.pos==="adjective")return adjectiveForms(e);if(e.pos==="verb")return verbForms(e);if(e.pos==="explicit")return e.forms||[e.lemma];return[e.lemma];}
function meaningsFor(e,author){const a=(e.sourceMeaningsBySource||{})[author];return (a&&a.length?a:e.meanings||[]);}
function entryByLemma(lemma,author){return VOCAB.find(v=>v.lemma===lemma&&(v.practiceSources||[]).includes(author));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function groups(author){const arr=AUTHOR_ORDER[author]||[];const gs=[];for(let i=0;i<arr.length;i+=10)gs.push(arr.slice(i,i+10));return gs;}
function updateSets(){const author=document.getElementById('author').value;const sel=document.getElementById('set');sel.innerHTML='';groups(author).forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i*10+1}–${i*10+g.length}`;sel.appendChild(o);});updatePreview();}
function currentSet(){const author=document.getElementById('author').value;const i=Number(document.getElementById('set').value||0);return groups(author)[i]||[];}
function updatePreview(){const author=document.getElementById('author').value;const box=document.getElementById('wordPreview');const g=currentSet();box.innerHTML=g.map((lemma,i)=>{const e=entryByLemma(lemma,author);return `<div class="word"><span class="muted">${Number(document.getElementById('set').value||0)*10+i+1}.</span> ${e?e.displayEntry:lemma}</div>`}).join('');document.getElementById('count').max=Math.max(1,g.length);if(Number(document.getElementById('count').value)>g.length)document.getElementById('count').value=g.length;}
function makeQuiz(){const author=document.getElementById('author').value;const setIndex=Number(document.getElementById('set').value||0);const source=currentSet().map(l=>entryByLemma(l,author)).filter(Boolean);const n=Math.min(Math.max(1,Number(document.getElementById('count').value||10)),source.length);const chosen=shuffle(source).slice(0,n);const items=chosen.map(e=>({e,form:choice(formsFor(e))||e.lemma}));const start=setIndex*10+1,end=start+currentSet().length-1;return {author,start,end,items};}
function renderQuiz(v){return `<section class="screen"><h2>${v.author} — Vocabulary Forms</h2><div class="meta">Words ${v.start}–${v.end}</div><div class="quizgrid">${v.items.map((x,i)=>`<div class="quizitem"><span class="num">${i+1}.</span><span class="form">${x.form}</span></div>`).join('')}</div></section>`;}
function generate(){const quiz=makeQuiz();document.getElementById('output').innerHTML=renderQuiz(quiz);}
document.getElementById('author').addEventListener('change',updateSets);document.getElementById('set').addEventListener('change',updatePreview);document.getElementById('generate').addEventListener('click',generate);document.getElementById('regen').addEventListener('click',generate);updateSets();generate();

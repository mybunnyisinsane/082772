    add([s.slice(0,-1)+"iō",s+"s",s+"t",s+"mus",s+"tis",s+"unt"]);
    add([s.slice(0,-1)+"ior",s+"ris",s+"tur",s+"mur",s+"minī",s+"untur"]);
  }
  let imp;
  if (e.conj===1 || e.conj===2) imp=s+"b";
  else if (e.conj===3) imp=s+"ēb";
  else if (e.conj==="3io") imp=s+"iēb";
  else if (e.conj===4) imp=s.slice(0,-1)+"iēb";
  add([imp+"am",imp+"ās",imp+"at",imp+"āmus",imp+"ātis",imp+"ant"]);
  if (e.conj===1 || e.conj===2) {
    const f=s+"b"; add([f+"ō",f+"is",f+"it",f+"imus",f+"itis",s+"bunt"]);
  } else {
    const base=e.conj==="3io" ? s+"i" : (e.conj===4 ? s.slice(0,-1)+"i" : s);
    add([base+"am",base+"ēs",base+"et",base+"ēmus",base+"ētis",base+"ent"]);
  }
  const ps=scPerfectStem(e);
  if(ps) add([ps+"ī",ps+"istī",ps+"it",ps+"imus",ps+"istis",ps+"ērunt",ps+"eram",ps+"erās",ps+"erat",ps+"erāmus",ps+"erātis",ps+"erant"]);
  if(e.pp && e.pp[1]) out.add(e.pp[1]);
  if(e.pp && e.pp[3]) out.add(e.pp[3]);
  return [...out];
}
function scFormsFor(e) {
  if (e.explicitForms && e.explicitForms.length && (e.pos==="noun" || e.pos==="adjective" || e.pos==="other" || e.pos==="explicit")) return [...new Set(e.explicitForms)];
  if (e.explicitForms && e.explicitForms.length && e.pos==="other") return [...new Set(e.explicitForms)];
  if (e.pos==="noun") return scNounForms(e);
  if (e.pos==="adjective") return scAdjectiveForms(e);
  if (e.pos==="verb") return scVerbForms(e);
  return (e.explicitForms && e.explicitForms.length) ? [...new Set(e.explicitForms)] : [e.lemma];
}
function choice(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function apEntry(lemma,author){return AP_VOCAB.find(v=>v.lemma===lemma&&((v.practiceSources||[]).includes(author)||(v.sources||[]).includes(author)));}
function apGroups(author){const arr=AUTHOR_ORDER[author]||[];const gs=[];for(let i=0;i<arr.length;i+=10)gs.push(arr.slice(i,i+10));return gs;}
function courseTopics(course){
 if(course==='latin1') return [...new Set(SCHOOL_VOCAB.filter(e=>e.scope==='latin1').flatMap(e=>e.themes||[]))].sort((a,b)=>a.localeCompare(b));
 if(course==='latin2') return [...new Set(SCHOOL_VOCAB.filter(e=>e.scope==='latin2').flatMap(e=>e.topics||[]))].sort((a,b)=>a.localeCompare(b));
 if(course==='latin3') return ['Catullus','Mostellaria','Hannibal','Historia Celata','Sallust'];
 return [];
}
function schoolPool(course,topic){
 if(course==='latin1') return SCHOOL_VOCAB.filter(e=>e.scope==='latin1'&&(e.themes||[]).includes(topic));
 if(course==='latin2') return SCHOOL_VOCAB.filter(e=>e.scope==='latin2'&&(e.topics||[]).includes(topic));
 if(course==='latin3') return SCHOOL_VOCAB.filter(e=>e.latin3Unit&&(e.units||[]).includes(topic));
 return [];
}
function schoolGroups(course,topic){const arr=schoolPool(course,topic);const gs=[];for(let i=0;i<arr.length;i+=10)gs.push(arr.slice(i,i+10));return gs;}
function updateControls(){
 const course=document.getElementById('course').value; const isAP=course==='ap';
 document.getElementById('topicBox').classList.toggle('hidden',isAP);
 document.getElementById('authorBox').classList.toggle('hidden',!isAP);
 document.getElementById('setBox').classList.remove('hidden');
 if(isAP) updateSets(); else updateTopics();
}
function updateTopics(){
 const course=document.getElementById('course').value,sel=document.getElementById('topic');sel.innerHTML='';
 courseTopics(course).forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
 updateSets();
}
function updateSets(){
 const course=document.getElementById('course').value,sel=document.getElementById('set');sel.innerHTML='';
 const groups=course==='ap' ? apGroups(document.getElementById('author').value) : schoolGroups(course,document.getElementById('topic').value);
 groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;const range=`${i*10+1}–${i*10+g.length}`;o.textContent=course==='ap'?`${document.getElementById('author').value} ${range}`:range;sel.appendChild(o);});
 updateCountLimit();
}
function availableCount(){
 const course=document.getElementById('course').value,i=Number(document.getElementById('set').value||0);
 if(course==='ap'){const a=document.getElementById('author').value;return (apGroups(a)[i]||[]).length;}
 return (schoolGroups(course,document.getElementById('topic').value)[i]||[]).length;
}
function updateCountLimit(){const n=Math.max(1,availableCount());const inp=document.getElementById('count');inp.max=Math.min(10,n);if(Number(inp.value)>Number(inp.max))inp.value=inp.max;}
function makeQuiz(){
 const course=document.getElementById('course').value; const requested=Math.max(1,Number(document.getElementById('count').value||5));
 const i=Number(document.getElementById('set').value||0);
 if(course==='ap'){
   const author=document.getElementById('author').value,g=apGroups(author)[i]||[],pool=g.map(l=>apEntry(l,author)).filter(Boolean),n=Math.min(requested,pool.length),chosen=shuffle(pool).slice(0,n);
   return {title:author,meta:`Words ${i*10+1}–${i*10+g.length}`,items:chosen.map(e=>choice(apFormsFor(e))||e.lemma)};
 }
 const topic=document.getElementById('topic').value,g=schoolGroups(course,topic)[i]||[],n=Math.min(requested,g.length),chosen=shuffle(g).slice(0,n);
 const label=course==='latin1'?'Latin I':course==='latin2'?'Latin II':'Latin III/IV';
 return {title:`${label} — ${topic}`,meta:`Words ${i*10+1}–${i*10+g.length}`,items:chosen.map(e=>{const forms=scFormsFor(e).filter(Boolean);const alt=forms.filter(f=>scNormLatin(f)!==scNormLatin(e.lemma));return choice(alt.length?alt:forms)||e.lemma;})};
}
function renderQuiz(v){return `<section class="screen"><h2>${v.title}</h2><div class="meta">${v.meta}</div><div class="quizgrid">${v.items.map((f,i)=>`<div class="quizitem"><span class="num">${i+1}.</span><span class="form">${f}</span></div>`).join('')}</div></section>`;}
function generate(){document.getElementById('output').innerHTML=renderQuiz(makeQuiz());}
document.getElementById('course').addEventListener('change',()=>{updateControls();generate();});
document.getElementById('topic').addEventListener('change',()=>{updateSets();generate();});
document.getElementById('author').addEventListener('change',()=>{updateSets();generate();});
document.getElementById('set').addEventListener('change',()=>{updateCountLimit();generate();});
document.getElementById('generate').addEventListener('click',generate);
document.getElementById('regen').addEventListener('click',generate);
updateControls();generate();
</script></body></html>
